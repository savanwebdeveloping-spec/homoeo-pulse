services:
  - type: web
    name: homoeo-pulse-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
